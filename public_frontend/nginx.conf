worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format minimal '$time_iso8601 $status $request_time';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    # Nginx 模組的預設暫存路徑也須可寫，避免唯讀根檔案系統阻止啟動。
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_max_temp_file_size 0;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=public_api:1m rate=10r/s;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_hide_header Set-Cookie;
    # HTTP 測試不發送 HSTS；其他安全標頭共用，避免切換入口時遺漏。
    map $scheme $hsts {
        default "";
        https "max-age=31536000";
    }
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 無版本檔名的程式／固定設定也重新讀取；內容 API 絕不回應快取。
    add_header Cache-Control no-store always;
    # 相簿堆疊以行內 CSS 設定深度；JavaScript 仍只允許本機程式檔。
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # 明確白名單共四個 GET；不接受任意後端路徑或管理 API。
    map $uri $public_path {
        default "";
        /api/home /api/v1/public/home;
        /api/people /api/v1/public/people;
        /api/publications /api/v1/public/publications;
        "~^/api/people/(?<person_id>[a-zA-Z0-9][a-zA-Z0-9_-]{0,199})$" /api/v1/public/people/$person_id;
    }
    server {
        # 只有監聽與 TLS 設定依模式切換；頁面、檔案及 API 白名單共用。
        include /etc/nginx/transport.conf;
        server_name _;
        root /srv/code;
        disable_symlinks on;
        autoindex off;
        location /api/ {
            if ($public_path = "") { return 404; }
            if ($request_method != GET) { return 405; }
            limit_req zone=public_api burst=20 nodelay;
            set $lab_backend lab-public-api:8000;
            proxy_pass http://$lab_backend$public_path$is_args$args;
        }
        location = / { try_files /index.html =404; }
        location ~ ^/(index\.html|lab\.html)$ { try_files /index.html =404; }
        location ~ ^/(lab\.js|api\.js|lab\.css|gold\.css)$ { try_files $uri =404; }
        # 只掛載 public 子目錄；無法讀到兩個 SQLite、CSV、帳戶或備份。
        location = /data/site.json { alias /srv/public/site.json; }
        location ~* ^/assets/.+\.(svg|png|jpe?g|webp|pdf)$ {
            root /srv/public;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
