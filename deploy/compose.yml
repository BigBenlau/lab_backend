# 使用 sh deploy/lab.sh ...；Python、SQLite 與維護工具全部在容器內。
# 目前只生成設定，尚未執行 Docker 或驗證 Linux 掛載。
x-api: &api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: lab-api:demo
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 100
  mem_limit: 512m
  cpus: 1.0
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  public-api:
    <<: *api
    environment:
      LAB_STORAGE: /data
    networks:
      frontend_net:
        aliases: [lab-public-api]
    volumes:
      - type: volume
        source: lab_data
        target: /data/content
        read_only: true
        # 必須先 init 建立子目錄；不可把整個 volume 掛給公開服務。
        volume: {subpath: content, nocopy: true}

  admin-api:
    <<: *api
    command: ["python", "-m", "uvicorn", "lab_backend.application:admin_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-proxy-headers", "--no-access-log", "--limit-concurrency", "8"]
    environment:
      LAB_STORAGE: /data
      LAB_DEV: "false"
      LAB_HTTP_TEST: "false"
    networks: [admin_net]
    volumes:
      - type: volume
        source: lab_data
        target: /data

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: lab-gateway:demo
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    pids_limit: 50
    mem_limit: 256m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700"]
    environment:
      LAB_HTTP_TEST: "false"
    ports:
      # 啟動前在 Cloud 防火牆限制管理來源；程式不再維護 IP 清單。
      # 明確限 IPv4，避免新增未配置雲端防火牆的 IPv6 入口。
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
      - "0.0.0.0:27182:27182"
    # Nginx共用，但公開與管理API不互相加入對方網路。
    networks: [edge, frontend_net, admin_net]
    volumes:
      - type: volume
        source: lab_data
        target: /srv/public
        read_only: true
        volume: {subpath: public, nocopy: true}
      - type: bind
        source: ../secrets/tls
        target: /run/tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../secrets/public-tls
        target: /run/public-tls
        read_only: true
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # 同一 API 映像的維護入口；平常不啟動，不安裝主機 Python／Docker socket。
  # 明確執行 watch 才常駐監測；只發出內網探測，不提供 HTTP listener。
  tools:
    <<: *api
    profiles: [maintenance]
    command: ["python", "scripts/maintenance.py", "monitor", "--interval", "60"]
    environment:
      LAB_STORAGE: /data
    networks: [frontend_net, admin_net]
    volumes:
      - type: volume
        source: lab_data
        target: /data
    healthcheck: {disable: true}

volumes:
  # 同一個 local volume 保存兩庫、journal 及公開檔案；公開服務只掛指定子目錄。
  lab_data:
    driver: local

networks:
  edge: {}
  # 公開前端的伺服器容器加入此網路；API 不發布宿主機 port。
  frontend_net:
    name: lab-content
    internal: true
  admin_net:
    internal: true
