# 放入外部公開前端 Nginx 的現有 HTTPS server；不要加入管理 API 路由。
# Docker DNS 於請求時解析，API 暫時未啟動不阻止前端靜態頁面啟動。
resolver 127.0.0.11 valid=10s ipv6=off;
location = /api/home {
    limit_except GET { deny all; }
    set $lab_backend lab-public-api:8000;
    proxy_pass http://$lab_backend/api/v1/public/home;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;
}
# 只代理明確的唯讀端點，不能改成任意 /api/* 轉送。
location = /api/people {
    limit_except GET { deny all; }
    set $lab_backend lab-public-api:8000;
    proxy_pass http://$lab_backend/api/v1/public/people;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;
}
location = /api/publications {
    limit_except GET { deny all; }
    set $lab_backend lab-public-api:8000;
    proxy_pass http://$lab_backend/api/v1/public/publications;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;
}
location ~ ^/api/people/([a-zA-Z0-9][a-zA-Z0-9_-]{0,199})$ {
    limit_except GET { deny all; }
    set $person_id $1;
    set $lab_backend lab-public-api:8000;
    proxy_pass http://$lab_backend/api/v1/public/people/$person_id;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;
}
# 訪客級 rate limit、TLS、安全回應標頭沿用公開前端入口設定。
