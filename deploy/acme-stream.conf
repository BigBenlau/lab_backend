# 正式模式由 gateway 持有 443。僅依 TLS 握手協定選擇固定目的地，域名與裸 IP 走同一條路。
stream {
    map $ssl_preread_alpn_protocols $tls_target {
        ~^acme-tls/1$  127.0.0.1:8445;
        default        127.0.0.1:8444;
    }
    server {
        listen 8443;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 3s;
        # 分流後仍讓官網依訪客 IP 限流。這個對外 listener 不接受傳入的 PROXY 標頭。
        proxy_protocol on;
        proxy_pass $tls_target;
    }
    server {
        # lego 需要原始 TLS 握手。在 loopback 移除上一段附加的 PROXY 標頭。
        listen 127.0.0.1:8445 proxy_protocol;
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 3s;
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
        # 按需解析臨時容器的名稱，平日沒有 lego 也能啟動及重載官網。
        set $validator lab-tls-validation:8443;
        proxy_pass $validator;
    }
}
