# sh deploy/lab.sh http ... 明確選用；需支援 !override 的 Compose 2.24.4+。
# 使用同一映像及資料 volume，只替換官網入口，不複製頁面／API 路由。
services:
  public-web:
    # 必須取代整份清單，否則 Compose 會額外保留 443 與憑證掛載。
    # 主機80被既有服務使用時，可只改測試端口；容器及正式HTTPS端口保持固定。
    ports: !override ["0.0.0.0:${PUBLIC_HTTP_PORT:-80}:8080"]
    volumes: !override
      - type: volume
        source: lab_data
        target: /srv/public
        read_only: true
        volume: {subpath: public, nocopy: true}
      - type: bind
        source: ../public_frontend/nginx-http.conf
        target: /etc/nginx/transport.conf
        read_only: true
        bind: {create_host_path: false}

  # 普通 http up 只啟動官網與公開 API，不需要管理域名的憑證。
  # 管理端的帳密、Origin／CSRF 及 Secure Cookie 設定完全沿用正式模式。
  admin-api:
    profiles: [https-admin]
  gateway:
    profiles: [https-admin]
