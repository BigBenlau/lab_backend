# 只在正式模式載入。$host 為 Nginx 正規化並去掉端口的主機名稱。
map $host $public_redirect_host {
    default "";
    include /tmp/public-names.map;
}
map $host $admin_redirect_host {
    default "";
    include /tmp/admin-names.map;
}

# 主機的 80 只接收瀏覽器導航；頁面、API 和登入仍由各自的 TLS 入口提供。
server {
    listen 8080 default_server;
    server_name _;
    if ($request_method !~ ^(GET|HEAD)$) { return 400; }
    if ($public_redirect_host = "") { return 400; }
    if ($request_uri !~ ^/) { return 400; }
    return 301 https://$public_redirect_host$request_uri;
}
